name: Batch 2 Pint Diagnostic

on:
  push:
    branches:
      - feature/improvements

jobs:
  pint-diff:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest
      - name: Show exact Pint changes
        shell: bash
        run: |
          vendor/bin/pint src/Cache/Adapter/CachePayloadCodec.php src/Cluster/Transport/Pdo/PdoInvalidationSchema.php
          git diff -- src/Cache/Adapter/CachePayloadCodec.php src/Cluster/Transport/Pdo/PdoInvalidationSchema.php
